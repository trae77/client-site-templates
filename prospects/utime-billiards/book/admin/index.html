<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Bookings dashboard | U-TIME International Billiards & Sports Bar</title><link rel="stylesheet" href="../../addons.css"></head><body class="ao">
<header class="top"><a href="../../index.html">U-TIME International Billiards & Sports Bar</a></header><p class="pv">Preview built by TTA Web Design. Not live yet.</p>
<main class="bk" style="max-width:1000px">
<h1>Upcoming bookings</h1>
<form id="lf" class="card"><label for="tk">Admin token</label><input id="tk" type="password" autocomplete="current-password">
<div class="row"><button class="btn" type="submit">Load bookings</button><button class="btn ghost" type="button" id="lo">Forget token</button></div><p class="err" id="er"></p></form>
<div id="list" class="card" hidden></div>
</main>
<script>
(() => {
const API = "https://utime-api.ttawebdev.com/booking", K = "utime_booking_admin";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tk = document.getElementById("tk"), er = document.getElementById("er"), list = document.getElementById("list");
tk.value = sessionStorage.getItem(K) || "";
async function call(path, body) {
  const r = await fetch(API + path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + tk.value.trim(), "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || "Error"); return j;
}
async function load() {
  er.textContent = "";
  try {
    const { bookings } = await call("/admin/bookings"); sessionStorage.setItem(K, tk.value.trim());
    list.hidden = false;
    list.innerHTML = bookings.length ? `<table><thead><tr><th>When</th><th>Service</th><th>Customer</th><th>Notes</th><th>Status</th><th></th></tr></thead><tbody>${bookings.map(b => `<tr><td>${esc(b.when)}</td><td>${esc(b.serviceName)}</td><td>${esc(b.name)}<br><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><br><a href="mailto:${esc(b.email)}">${esc(b.email)}</a></td><td>${esc(b.notes)}</td><td>${esc(b.status)}</td><td>${b.status === "confirmed" ? `<button class="btn ghost" data-id="${esc(b.id)}">Cancel</button>` : ""}</td></tr>`).join("")}</tbody></table>` : "<p>No upcoming bookings.</p>";
    list.querySelectorAll("[data-id]").forEach(b => b.onclick = async () => { if (!confirm("Cancel this booking?")) return; await call("/admin/cancel", { id: b.dataset.id }); load(); });
  } catch (e) { list.hidden = true; er.textContent = e.message === "unauthorized" ? "Wrong token." : e.message; }
}
document.getElementById("lf").onsubmit = e => { e.preventDefault(); load(); };
document.getElementById("lo").onclick = () => { sessionStorage.removeItem(K); tk.value = ""; list.hidden = true; };
if (tk.value) load();
})();
</script></main></body></html>
