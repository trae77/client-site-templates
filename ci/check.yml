name: check
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Matrix check (rebuild every sample; mockup.mjs refuses forbidden features)
        run: bash tools/build-samples.sh
      - name: Industry audit (samples, prospects, templates)
        run: npm run audit:industry
      - name: Prospect noindex + concept notice
        run: node tools/prospect-notice.mjs --check
      - name: axe-core (fails on serious/critical), samples + all palettes
        run: npm run test:a11y
      - name: Pickup-order flow (390 + 1440)
        run: npm run test:order
